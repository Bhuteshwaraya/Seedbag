<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">A new conversation. The same project.</title>
  <desc id="desc">You talk through a project. Your assistant records goals, decisions, questions and next steps in project files and saves a private GitHub checkpoint. In a later conversation, you paste the project's continuation prompt and the assistant reads those files to continue. Codex can work from a local copy. Only recorded and shared work travels between environments.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#a46c35" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="430" rx="24" fill="#faf7ef"/>
  <g font-family="Segoe UI,Arial,sans-serif" fill="#233f35">
    <text x="600" y="48" text-anchor="middle" font-size="30" font-weight="650">A new conversation. The same project.</text>
    <rect x="30" y="87" width="320" height="258" rx="20" fill="#ffffff" stroke="#d9e2d9" stroke-width="2"/>
    <rect x="440" y="87" width="320" height="258" rx="20" fill="#eef3e9" stroke="#c6d7c4" stroke-width="2"/>
    <rect x="850" y="87" width="320" height="258" rx="20" fill="#ffffff" stroke="#d9e2d9" stroke-width="2"/>
    <g fill="#f0e5d0"><circle cx="66" cy="121" r="16"/><circle cx="476" cy="121" r="16"/><circle cx="886" cy="121" r="16"/></g>
    <g font-size="16" font-weight="700" text-anchor="middle"><text x="66" y="127">1</text><text x="476" y="127">2</text><text x="886" y="127">3</text></g>
    <g font-size="23" font-weight="650"><text x="92" y="129">Talk through the work</text><text x="502" y="129">Keep what matters</text><text x="912" y="129">Pick it up later</text></g>
    <g stroke="#54715b" stroke-width="2.5" stroke-linejoin="round">
      <path d="M93 162 H284 Q296 162 296 174 V219 Q296 231 284 231 H160 L137 251 V231 H93 Q81 231 81 219 V174 Q81 162 93 162 Z" fill="#f4f6ef"/>
      <path d="M913 162 H1104 Q1116 162 1116 174 V219 Q1116 231 1104 231 H980 L957 251 V231 H913 Q901 231 901 219 V174 Q901 162 913 162 Z" fill="#f4f6ef"/>
    </g>
    <g stroke-width="7" stroke-linecap="round"><path d="M105 184 H240 M925 184 H1060" stroke="#8fa88c"/><path d="M105 207 H269 M925 207 H1089" stroke="#d8a17e"/></g>
    <g font-size="17" text-anchor="middle" fill="#46564c"><text x="190" y="286">Explain, explore, decide.</text><text x="190" y="313">Speak normally with your assistant.</text><text x="1010" y="286">Paste your continuation prompt.</text><text x="1010" y="313">Continue from the saved work.</text></g>
    <g font-size="17">
      <rect x="474" y="156" width="252" height="33" rx="7" fill="#fff"/><rect x="474" y="197" width="252" height="33" rx="7" fill="#fff"/>
      <circle cx="491" cy="172" r="5" fill="#769779"/><circle cx="491" cy="213" r="5" fill="#ba7a56"/>
      <text x="506" y="179">Goals and decisions</text><text x="506" y="220">Questions and next steps</text>
    </g>
    <text x="600" y="272" text-anchor="middle" font-size="18" font-weight="650">Your project files</text>
    <text x="600" y="299" text-anchor="middle" font-size="16" fill="#46564c">Private GitHub checkpoints</text>
    <text x="600" y="322" text-anchor="middle" font-size="16" fill="#46564c">A local copy when using Codex</text>
    <g stroke="#a46c35" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M364 207 H424"/><path d="M774 207 H834"/></g>
    <g font-size="13" text-anchor="middle" fill="#78512c"><text x="395" y="169">Assistant</text><text x="395" y="185">records</text><text x="805" y="169">Assistant</text><text x="805" y="185">reads</text></g>
    <text x="600" y="385" text-anchor="middle" font-size="17" fill="#46564c">Your assistant maintains the files. Only work that was recorded and shared can travel with you.</text>
  </g>
</svg>
